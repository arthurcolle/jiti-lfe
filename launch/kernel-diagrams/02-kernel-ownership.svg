<text x="64" y="1280" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="start" fill="#007E70">DURABLE REVISION STORE</text>
<text x="64" y="1318" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" fill="#182B2B">Accepted code + data, with history</text>
<text x="40" y="1387" font-family="DejaVu Sans" font-size="24" font-weight="normal" text-anchor="start" fill="#4C6060">The adapter defines what can be restored.</text>
