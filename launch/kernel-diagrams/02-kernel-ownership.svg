<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1410" viewBox="0 0 680 1410" role="img" aria-labelledby="title desc">
<title id="title">The kernel keeps execution and acceptance coherent</title>
<desc id="desc">The controller validates tool arguments and sends actions one at a time to a persistent worker, receiving observations and results in return. The worker owns evaluation, the live stack and active restarts. Inside that worker, the world adapter provides managed code and data, the function catalogue, checkpoint and restore, and durable export and import. Caller-supplied safety checks and goals are assessed at safe points. Safety determines whether a candidate may be kept; goals determine completion. Accepted managed changes publish durable revisions. The reference adapter covers named functions and readable table data.</desc>
<rect width="680" height="1410" fill="#FAFAF7"/>
<text x="40" y="49" font-family="DejaVu Sans" font-size="20" font-weight="bold" text-anchor="start" fill="#007E70">02  /  A LIVING LISP APPLICATION</text>
<text x="40" y="100" font-family="DejaVu Sans" font-size="34" font-weight="bold" text-anchor="start" fill="#182B2B">One worker owns the world.</text>
<text x="40" y="140" font-family="DejaVu Sans" font-size="24" font-weight="normal" text-anchor="start" fill="#4C6060">A small protocol around a live Lisp application.</text>
<rect x="40" y="178" width="600" height="117" rx="15" fill="#FFFFFF" stroke="#C9D5D1" stroke-width="1.5"/>
<text x="64" y="219" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="start" fill="#007E70">CONTROLLER</text>
<text x="64" y="260" font-family="DejaVu Sans" font-size="24" font-weight="normal" text-anchor="start" fill="#182B2B">Validate arguments. Route actions serially.</text>
