<text x="458" y="356" font-family="DejaVu Sans" font-size="23" font-weight="normal" text-anchor="start" fill="#4C6060">Results</text>
<rect x="40" y="408" width="600" height="753" rx="15" fill="#E5F3EF" stroke="#007E70" stroke-width="1.5"/>
<text x="64" y="451" font-family="DejaVu Sans" font-size="23" font-weight="bold" text-anchor="start" fill="#007E70">PERSISTENT WORKER</text>
<text x="64" y="488" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" fill="#182B2B">Owns live application operations</text>
<rect x="64" y="522" width="552" height="135" rx="15" fill="#FFFFFF" stroke="#C9D5D1" stroke-width="1.5"/>
<text x="86" y="561" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="start" fill="#007E70">LISP EVALUATION</text>
<text x="86" y="601" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" fill="#182B2B">Running code + live call stack</text>
<text x="86" y="636" font-family="DejaVu Sans" font-size="24" font-weight="normal" text-anchor="start" fill="#182B2B">Active restarts stay on this thread.</text>
<rect x="64" y="683" width="552" height="177" rx="15" fill="#FFFFFF" stroke="#C9D5D1" stroke-width="1.5"/>
<text x="86" y="722" font-family="DejaVu Sans" font-size="21" font-weight="bold" text-anchor="start" fill="#007E70">WORLD ADAPTER</text>
<text x="86" y="762" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" fill="#182B2B">Managed code, data and catalogue</text>
<text x="86" y="800" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" fill="#182B2B">Checkpoint / restore</text>
<text x="86" y="838" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" fill="#182B2B">Durable export / import</text>
<rect x="64" y="886" width="552" height="236" rx="15" fill="#FFFFFF" stroke="#C9D5D1" stroke-width="1.5"/>
<text x="86" y="925" font-family="DejaVu Sans" font-size="20" font-weight="bold" text-anchor="start" fill="#007E70">CALLER CHECKS · AT SAFE POINTS</text>
